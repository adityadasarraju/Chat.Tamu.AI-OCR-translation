<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TAMU OCR Translator</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>
  <main>
    <h1>TAMU OCR Translator</h1>

    <p class="description">
      Select visible text and translate it into English.
    </p>

    <label for="apiKey">
      TAMU AI API key
    </label>

    <div class="key-row">
      <input
        id="apiKey"
        type="password"
        placeholder="Enter your TAMU AI API key"
        autocomplete="off"
        spellcheck="false"
      >

      <button
        id="toggleKey"
        class="secondary"
        type="button"
      >
        Show
      </button>
    </div>

    <label for="model">
      Image-input model
    </label>

    <select id="model">
      <optgroup label="Recommended">
        <option
          value="protected.gemini-2.5-flash"
          selected
        >
          Gemini 2.5 Flash
        </option>

        <option value="protected.gpt-4o">
          GPT-4o
        </option>

        <option value="protected.gpt-4.1-mini">
          GPT-4.1 Mini
        </option>

        <option value="protected.gemini-2.5-pro">
          Gemini 2.5 Pro
        </option>
      </optgroup>

      <optgroup label="OpenAI">
        <option value="protected.gpt-4.1">
          GPT-4.1
        </option>

        <option value="protected.gpt-4.1-mini">
          GPT-4.1 Mini
        </option>

        <option value="protected.gpt-4.1-nano">
          GPT-4.1 Nano
        </option>

        <option value="protected.gpt-4o">
          GPT-4o
        </option>

        <option value="protected.gpt-5">
          GPT-5
        </option>

        <option value="protected.gpt-5-mini">
          GPT-5 Mini
        </option>

        <option value="protected.gpt-5-nano">
          GPT-5 Nano
        </option>

        <option value="protected.gpt-5.1">
          GPT-5.1
        </option>

        <option value="protected.gpt-5.2">
          GPT-5.2
        </option>

        <option value="protected.gpt-5.4">
          GPT-5.4
        </option>

        <option value="protected.gpt-5.4-mini">
          GPT-5.4 Mini
        </option>

        <option value="protected.gpt-5.4-nano">
          GPT-5.4 Nano
        </option>

        <option value="protected.gpt-5.5">
          GPT-5.5
        </option>

        <option value="protected.gpt-5.6-luna">
          GPT-5.6 Luna
        </option>

        <option value="protected.gpt-5.6-sol">
          GPT-5.6 Sol
        </option>

        <option value="protected.gpt-5.6-terra">
          GPT-5.6 Terra
        </option>
      </optgroup>

      <optgroup label="Google Gemini">
        <option value="protected.gemini-2.5-flash-lite">
          Gemini 2.5 Flash Lite
        </option>

        <option value="protected.gemini-2.5-flash">
          Gemini 2.5 Flash
        </option>

        <option value="protected.gemini-2.5-pro">
          Gemini 2.5 Pro
        </option>

        <option value="protected.gemini-3.1-flash-lite">
          Gemini 3.1 Flash Lite
        </option>

        <option value="protected.gemini-3.5-flash">
          Gemini 3.5 Flash
        </option>
      </optgroup>

      <optgroup label="Anthropic Claude">
        <option value="protected.Claude 3.5 Haiku">
          Claude 3.5 Haiku
        </option>

        <option value="protected.Claude-Haiku-4.5">
          Claude Haiku 4.5
        </option>

        <option value="protected.Claude Sonnet 4">
          Claude Sonnet 4
        </option>

        <option value="protected.Claude Sonnet 4.5">
          Claude Sonnet 4.5
        </option>

        <option value="protected.Claude Sonnet 4.6">
          Claude Sonnet 4.6
        </option>

        <option value="protected.Claude-Sonnet-5">
          Claude Sonnet 5
        </option>

        <option value="protected.Claude Opus 4.1">
          Claude Opus 4.1
        </option>

        <option value="protected.Claude Opus 4.5">
          Claude Opus 4.5
        </option>

        <option value="protected.Claude Opus 4.6">
          Claude Opus 4.6
        </option>

        <option value="protected.Claude Opus 4.7">
          Claude Opus 4.7
        </option>

        <option value="protected.Claude Opus 4.8">
          Claude Opus 4.8
        </option>

        <option value="protected.Claude-Opus-5">
          Claude Opus 5
        </option>
      </optgroup>
    </select>

    <p class="model-help">
      Start with Gemini 2.5 Flash. If a model rejects image input,
      select a different model.
    </p>

    <section
      class="translation-options"
      aria-label="Translation enhancement options"
    >
      <label
        class="option-row"
        for="aiProofreader"
      >
        <input
          id="aiProofreader"
          type="checkbox"
        >

        <span class="option-copy">
          <span class="option-title">
            AI proofreader (slightly more expensive)
          </span>

          <span class="option-description">
            Improve English grammar and readability.
          </span>
        </span>
      </label>

      <label
        class="option-row"
        for="smoothDialogue"
      >
        <input
          id="smoothDialogue"
          type="checkbox"
        >

        <span class="option-copy">
          <span class="option-title">
            Smooth Dialogue (more expensive)
          </span>

          <span class="option-description">
            Reference recent translations for consistent dialogue,
            names, tone, and context.
          </span>
        </span>
      </label>
    </section>

    <button
      id="translateButton"
      class="primary"
      type="button"
    >
      Select text to translate
    </button>

    <button
      id="historyButton"
      class="secondary history-button"
      type="button"
    >
      Show translation history
    </button>

    <p
      id="status"
      role="status"
      aria-live="polite"
    ></p>

    <p class="privacy">
      Your API key is stored only for the current Chrome session.
      The selected screenshot is sent directly to chat-api.tamu.ai.
    </p>
  </main>

  <div
    id="costToast"
    class="cost-toast"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <script src="popup.js"></script>
</body>
</html>
